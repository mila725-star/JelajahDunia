<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi Jelajah Dunia!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.9/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"></script>
<style>
:root{--H:min(calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),56.25vw);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{font-size:clamp(9px,calc(var(--H)/40),24px)}
html,body{margin:0;height:100%;overflow:hidden;background:#3b8fe8;color:#eaf2ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(ellipse at 15% 5%,#b9e6ff 0,#6cc0ff 35%,#3b8fe8 75%,#2a72d0 100%);display:flex;align-items:center;justify-content:center}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 20%,#fffc,transparent),radial-gradient(2px 2px at 78% 12%,#fffd,transparent),radial-gradient(3px 3px at 40% 85%,#fff9,transparent),radial-gradient(2px 2px at 90% 60%,#fffc,transparent),radial-gradient(2px 2px at 6% 75%,#fff9,transparent),radial-gradient(ellipse 18% 9% at 85% 90%,#ffffff40,transparent),radial-gradient(ellipse 20% 10% at 10% 92%,#ffffff40,transparent),radial-gradient(ellipse 16% 8% at 55% 4%,#ffffff33,transparent)}
.stage{position:relative;height:var(--H);width:calc(var(--H)*16/9);display:flex;flex-direction:column;padding:.8% 2.5% 1%}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:9.5%}
h1{font-family:"Lilita One","Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:400;font-size:2.05rem;letter-spacing:.03em;margin:0;white-space:nowrap;line-height:1.1;color:#fff;-webkit-text-stroke:.07em #12408f;paint-order:stroke fill;text-shadow:0 .06em 0 #12408f,0 .11em 0 #0d2f6b,0 .2em .35em rgba(0,30,90,.55)}
h1 .w2{color:#ffd23f}h1 .w3{color:#ff9ec1}
.ttl{display:flex;align-items:center;gap:.6rem}
.em{display:inline-block;font-size:2rem;line-height:1;animation:bob 3s ease-in-out infinite}

@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-.15em) rotate(6deg)}}
.sub{color:#9db4d8;font-size:.85rem;margin-bottom:.4rem}
.hud{display:flex;gap:.6rem;font-size:.92rem;color:#fff}
.hud span{background:#0b2a5bb3;border-radius:99px;padding:.3rem .9rem}
.hud b{color:#ffd166}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:1.5%}
.left{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
#gwrap{width:calc(var(--H)*.875);height:calc(var(--H)*.875);border-radius:50%;box-shadow:0 0 50px 8px rgba(80,160,255,.35),0 0 120px 30px rgba(60,120,255,.15),inset 0 0 30px rgba(120,190,255,.25)}
canvas{width:100%;height:100%;display:block;border-radius:50%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.right{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;gap:.6rem;text-align:center}
.dt a,.dt{}
.left{position:relative;display:flex;align-items:center;justify-content:center;align-self:center}
.menu{display:none;flex-direction:column;gap:.4rem;width:100%;background:#0b2a5bf2;border:1px solid #ffffff77;border-radius:1rem;padding:.5rem;box-shadow:0 6px 20px rgba(5,30,80,.45)}
.menu button{padding:.5rem .4rem;font-size:.9rem;border-radius:.8rem;width:100%}
.menu .how{background:transparent;border:1px dashed #ffffff88;font-size:.8rem;padding:.4rem .3rem}
.menu .go{padding:.6rem .4rem;font-size:1rem}
.rmain{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.8rem}
.dt{display:flex;flex-direction:column;gap:.1rem;font-size:.82rem;color:#e8f1ff;min-width:0}
.dt b{font-size:1rem;color:#fff}
.dt .lbl{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#ffd166;font-weight:700}
.dt a{color:#bfe0ff;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt a:hover{color:#fff;text-decoration:underline}
.panel{background:#0e1a33e6;box-shadow:0 10px 30px rgba(10,40,100,.35);border:1px solid #243a66;border-radius:1rem;padding:.9rem;backdrop-filter:blur(6px);max-height:80%;overflow:hidden}
button.sel{border-color:#ffd166;background:#2b4a8f;box-shadow:0 0 0 2px #ffd16655}
button small{opacity:.8;font-size:.75rem}
.q{font-size:1.35rem;font-weight:600;margin-bottom:.7rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem}
button{font:inherit;font-size:1rem;color:#eaf2ff;background:#1a2d57;border:1px solid #33518f;border-radius:.8rem;padding:.7rem .5rem;cursor:pointer;transition:.15s}
button:hover:not(:disabled){background:#25427f;transform:translateY(-1px)}
button.ok{background:#1f8f4e!important;border-color:#52e08f}
button.bad{background:#a32d3a!important;border-color:#ff7a88}
button.go{background:linear-gradient(135deg,#ff9f1c,#ff6b3d);border:0;font-weight:700;padding:.8rem 1.8rem;font-size:1.1rem;color:#1b1000}
.msg{min-height:1.4em;margin-top:.6rem;font-size:1rem;color:#ffd166}
.tag{display:inline-block;font-size:.8rem;background:#25427f;border-radius:99px;padding:.15rem .8rem;margin-bottom:.5rem;color:#bcd0f0}
.info{display:none;background:linear-gradient(135deg,#16305f,#0e1a33);border:1px solid #ffd166;border-radius:1rem;padding:.8rem 1rem;box-shadow:0 6px 24px #0008;animation:pop .25s ease}
.info .n{font-size:1.5rem;font-weight:700;color:#ffd166}.info .c{margin-top:.3rem;font-size:1.1rem}
.devwrap{position:relative;flex:none;z-index:20}
.devbtn{display:flex;flex-direction:column;align-items:center;gap:.1rem;background:none;border:0;padding:0;cursor:pointer;color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 3px rgba(10,50,120,.8)}
.devbtn:hover:not(:disabled){background:none;transform:translateY(-1px)}
.devbtn img{width:2.8rem;height:2.8rem;border-radius:50%;object-fit:cover;object-position:50% 12%;border:.15rem solid #ffd166;box-shadow:0 0 0 0 rgba(255,209,102,.7);animation:ping 2.4s ease-out infinite;background:#c00}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,209,102,.7)}70%,100%{box-shadow:0 0 0 .6rem rgba(255,209,102,0)}}
.devpop{position:absolute;top:calc(100% + .5rem);right:0;width:27rem;display:flex;gap:1rem;align-items:center;text-align:left;background:#0b2a5bf2;border:1px solid #ffffff66;border-radius:1rem;padding:.8rem;box-shadow:0 14px 40px rgba(5,30,80,.55);animation:pop .2s ease}
.devpop[hidden]{display:none}
.devpop img{width:9rem;height:13.5rem;object-fit:cover;border-radius:.8rem;border:.15rem solid #ffd166;flex:none}
.devpop .dt{font-size:.9rem;gap:.35rem}
.devpop .dt b{font-size:1.1rem}
.mcol{min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.7rem;padding-bottom:.2rem}
.mcol img{width:8.4rem;height:auto;filter:drop-shadow(0 .4rem .5rem rgba(5,30,80,.45));transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite}
#mas.jump{animation:hop .7s ease}
#mas.oops{animation:wob .7s ease}
.bub{position:relative;width:100%;background:#fff;color:#12326b;border-radius:1rem;padding:.6rem .7rem;font-size:.85rem;font-weight:600;line-height:1.35;text-align:center;box-shadow:0 6px 18px rgba(10,40,100,.3)}
.bub::after{content:"";position:absolute;left:50%;bottom:-.5rem;margin-left:-.5rem;border:.5rem solid transparent;border-top-color:#fff;border-bottom:0}
.bub.show{animation:pop .3s ease}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-.25rem)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-1.3rem) rotate(-6deg)}65%{transform:translateY(-.4rem) rotate(5deg)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.ghost{background:transparent;margin-top:.6rem}
ul{text-align:left;font-size:.95rem;color:#bcd0f0;padding-left:1.3rem;margin:.4rem 0 .8rem}
/* tata letak 3 kolom: globe tepat di tengah layar */
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);column-gap:1.5%;padding:.8% 2.5% 1%}
header,main{display:contents}
.ttl{grid-column:1;grid-row:1;align-self:start;justify-self:start;flex-direction:column;align-items:flex-start;gap:.15rem;z-index:2}
h1{white-space:normal;font-size:1.75rem;line-height:1.05}
.em{font-size:1.7rem}
.mcol{grid-column:1;grid-row:1;padding-top:8.6rem;z-index:1}
.left{grid-column:2;grid-row:1;align-self:center;justify-self:center}
#gwrap{width:calc(var(--H)*.95);height:calc(var(--H)*.95)}
.right{grid-column:3;grid-row:1;padding-top:7.6rem;height:auto}
.hud{grid-column:3;grid-row:1;align-self:start;justify-self:start;flex-direction:column;gap:.3rem;font-size:.85rem;z-index:2}
.hud span{padding:.25rem .8rem;white-space:nowrap}
.devwrap{grid-column:3;grid-row:1;align-self:start;justify-self:end}
.mcol img{min-height:0;flex:0 1 auto;width:7.2rem;height:auto;max-width:100%;object-fit:contain}
.bub{font-size:.8rem}
.menu button{padding:.4rem .4rem;font-size:.85rem}
.menu .go{padding:.5rem .4rem}
/* latar luar angkasa */
html,body{background:#02030a}
body{background:radial-gradient(ellipse 60% 50% at 16% 18%,rgba(120,60,210,.38),transparent 70%),radial-gradient(ellipse 55% 45% at 88% 82%,rgba(30,120,230,.32),transparent 70%),radial-gradient(ellipse 40% 30% at 72% 8%,rgba(230,80,170,.2),transparent 70%),radial-gradient(ellipse 70% 60% at 50% 50%,#0b1236 0,#04061a 65%,#010208 100%)}
.stars{background:none;overflow:hidden}
.stars i{position:absolute;left:0;top:0;border-radius:50%;background:transparent;animation:twk 4s ease-in-out infinite}
.stars i:nth-child(2){animation-duration:6s;animation-delay:-2s}
.stars i:nth-child(3){animation-duration:3s;animation-delay:-1s}
@keyframes twk{0%,100%{opacity:.35}50%{opacity:1}}
.stars b{position:absolute;top:-10%;left:-10%;width:9rem;height:2px;background:linear-gradient(90deg,transparent,#fff);border-radius:2px;opacity:0;transform:rotate(28deg);animation:shoot 11s linear infinite}
.stars b+b{animation-delay:-5s;top:-5%;left:30%;width:6rem}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(28deg)}2%{opacity:1}12%{opacity:0;transform:translate(70vw,38vh) rotate(28deg)}100%{opacity:0;transform:translate(70vw,38vh) rotate(28deg)}}
.homebtn{display:none;width:100%;background:linear-gradient(135deg,#ff9f1c,#ff6b3d);color:#1b1000;font-weight:700;border:0;border-radius:.9rem;padding:.7rem .4rem;font-size:.95rem;box-shadow:0 6px 18px rgba(5,30,80,.45)}
.homebtn:hover:not(:disabled){background:linear-gradient(135deg,#ffb23d,#ff7d52)}
.homebtn.sure{background:linear-gradient(135deg,#ef476f,#c92a54);color:#fff}
/* judul lebih besar, satu baris */
.ttl{flex-direction:row;align-items:center;gap:.5rem;white-space:nowrap}
h1{font-size:2.35rem;white-space:nowrap;line-height:1}
.em{font-size:1.9rem}
.mcol{padding-top:4rem}
</style>
</head>

var IF=IDNGEO.features,IFm={},CAPm={};IF.forEach(function(f){IFm[f.id]=f});
CAP.split(";").forEach(function(x){var q=x.split(",");CAPm[q[0]]=q[1]});
var IP=IF.map(function(f){return{id:f.id,n:f.properties.n,c:CAPm[f.properties.n]||"-",cen:d3.geo.centroid(f)}});
var PAL=["#4fb99f","#9b7fd1","#e58ab0","#c9a66b","#8e9ad8","#d6c38a","#d98b6a","#b58bb8","#a9a56a","#7ec8c8"],CM={};
function adjVerts(fs){var m={},adj=fs.map(function(){return[]});
  fs.forEach(function(f,i){f.geometry.coordinates.forEach(function(po){po.forEach(function(r){r.forEach(function(c){var k=c[0]+","+c[1];(m[k]=m[k]||{})[i]=1})})})});
  Object.keys(m).forEach(function(k){var a=Object.keys(m[k]).map(Number);if(a.length>1)a.forEach(function(x){a.forEach(function(y){if(x!==y&&adj[x].indexOf(y)<0)adj[x].push(y)})})});return adj}
function paint(fs,adj){var ci={},cnt=PAL.map(function(){return 0});
  fs.map(function(_,i){return i}).sort(function(a,b){return adj[b].length-adj[a].length}).forEach(function(i){
    var used={};adj[i].forEach(function(j){if(ci[j]!==undefined)used[ci[j]]=1});var c=-1;PAL.forEach(function(_,k){if(!used[k]&&(c<0||cnt[k]<cnt[c]))c=k});if(c<0)c=0;cnt[c]++;ci[i]=c;CM[fs[i].id]=PAL[c]})}
var wadj;try{wadj=topojson.neighbors(topo.objects[key].geometries)}catch(e){wadj=[]}
if(wadj.length!==feats.length)wadj=feats.map(function(){return[]});
paint(feats,wadj);paint(IF,adjVerts(IF));

var cv=document.getElementById("c"),ctx=cv.getContext("2d"),S=520,R=0;
var proj=d3.geo.orthographic().clipAngle(90).precision(.5);
var path=d3.geo.path().projection(proj).context(ctx);
var grat=d3.geo.graticule()();
var down=null,mode="intro",rot=[-100,-15],hl=null,hlCol="#ff9f1c",spin=true,drag=null;
var pal=["#5f8f4c","#7a9a4d","#a39a55","#6f9a5a","#8da05a","#b2a363","#4f8a58"];
function col(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%pal.length;return pal[h]}

function resize(){var w=document.getElementById("gwrap").clientWidth,d=window.devicePixelRatio||1;S=w;cv.width=cv.height=w*d;ctx.setTransform(d,0,0,d,0,0);R=w/2-2;proj.translate([w/2,w/2]).scale(R)}
function draw(){
  proj.rotate([rot[0],rot[1]]).scale(R*kz);
  var cx=S/2,cy=S/2,g;
  ctx.clearRect(0,0,S,S);
  g=ctx.createRadialGradient(cx-R*.35,cy-R*.35,R*.1,cx,cy,R);
  g.addColorStop(0,"#4aa3e8");g.addColorStop(.6,"#1d6bb5");g.addColorStop(1,"#0a2f63");
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
  ctx.beginPath();path(grat);ctx.strokeStyle="rgba(255,255,255,.1)";ctx.lineWidth=.5;ctx.stroke();
  ctx.lineWidth=.6;ctx.strokeStyle="rgba(20,40,25,.75)";
  if(mapId==="idn"){wfeats.forEach(function(f){if(f.id==="IDN")return;ctx.beginPath();path(f);ctx.globalAlpha=.55;ctx.fillStyle=CM[f.id]||"#5d6f5b";ctx.fill();ctx.globalAlpha=1;ctx.stroke()});ctx.lineWidth=.9;ctx.strokeStyle="rgba(10,30,15,.9)"}
  feats.forEach(function(f){if(f.id===(hl&&hl.id))return;ctx.beginPath();path(f);ctx.fillStyle=CM[f.id]||"#c9a66b";ctx.fill();ctx.stroke()});
  if(hl){ctx.beginPath();path(hl);ctx.fillStyle=hlCol;ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=1.6;ctx.stroke()}
  if(hl!==hlCache){hlCache=hl;hc=hl?d3.geo.centroid(hl):null}
  if(hl&&hc&&mapId==="idn"&&d3.geo.distance(hc,[-rot[0],-rot[1]])<1.5){var mp=proj(hc),pu=Math.sin(performance.now()/220)*.5+.5;
    ctx.beginPath();ctx.arc(mp[0],mp[1],R*(.025+.02*pu),0,7);ctx.strokeStyle="rgba(255,255,255,"+(.9-.5*pu)+")";ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(mp[0],mp[1],R*.012,0,7);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#ff6b3d";ctx.lineWidth=2;ctx.stroke()}
  g=ctx.createRadialGradient(cx-R*.4,cy-R*.4,R*.05,cx,cy,R);
  g.addColorStop(0,"rgba(255,255,255,.28)");g.addColorStop(.35,"rgba(255,255,255,0)");g.addColorStop(.75,"rgba(0,10,40,.18)");g.addColorStop(1,"rgba(0,5,25,.5)");
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fillStyle=g;ctx.fill();
  var ppk=R*kz/6371,LK=[100,200,500,1000,2000,5000,10000],km=LK[0];LK.forEach(function(v){if(v*ppk<=R*.5)km=v});
  var bw=km*ppk,bx=cx-bw/2,by=cy+R*.82,fs=Math.max(11,R*.045);
  ctx.save();ctx.strokeStyle="#fff";ctx.fillStyle="#fff";ctx.lineWidth=2;ctx.shadowColor="rgba(0,20,60,.95)";ctx.shadowBlur=4;
  ctx.beginPath();ctx.moveTo(bx,by-5);ctx.lineTo(bx,by);ctx.lineTo(bx+bw,by);ctx.lineTo(bx+bw,by-5);ctx.stroke();
  ctx.font="600 "+fs+"px system-ui,sans-serif";ctx.textAlign="center";ctx.fillText("Skala ± "+km.toLocaleString("id-ID")+" km",cx,by+fs*1.3);ctx.restore();
  ctx.restore();
}
var tw=null;
function rotateTo(cen){
  var a=rot.slice(),b=[-cen[0],Math.max(-70,Math.min(70,-cen[1]))],dl=((b[0]-a[0]+540)%360)-180,t0=performance.now();
  spin=false;tw=function(t){var k=Math.min(1,(t-t0)/1300),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;rot=[a[0]+dl*e,a[1]+(b[1]-a[1])*e];if(k>=1)tw=null}
}
function loop(t){kz+=(kt-kz)*.08;if(tw)tw(t);else if(spin&&!drag)rot[0]+=.15;draw();requestAnimationFrame(loop)}
cv.addEventListener("pointerdown",function(e){down=drag=[e.clientX,e.clientY];tw=null;cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",function(e){if(!drag)return;rot[0]+=(e.clientX-drag[0])*.4*(520/S/kz);rot[1]=Math.max(-90,Math.min(90,rot[1]-(e.clientY-drag[1])*.4*(520/S/kz)));drag=[e.clientX,e.clientY]});
cv.addEventListener("pointerup",function(e){drag=null;if(down&&Math.abs(e.clientX-down[0])+Math.abs(e.clientY-down[1])<6&&mode!=="game")pick(e);down=null});
function pick(e){
  var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,k=window.devicePixelRatio||1,f=null,info=document.getElementById("info");
  proj.rotate([rot[0],rot[1]]).scale(R*kz);
  for(var i=0;i<feats.length;i++){ctx.beginPath();path(feats[i]);if(ctx.isPointInPath(x*k,y*k)){f=feats[i];break}}
  if(!f){info.style.display="none";hl=null;return}
  var d=DATA.filter(function(q){return q.id===f.id})[0];
  var nm=d?d.n:((f.properties&&f.properties.name)||"Wilayah"),cp=d?d.c:"belum tersedia di data";
  hl=f;hlCol="#ffd166";if(mapId==="world")rotateTo(d3.geo.centroid(f));
  info.style.display="none";void info.offsetWidth;
  info.innerHTML='<div class="n">📍 '+nm+'</div><div class="c">🏛️ '+(mapId==="idn"?"Ibukota provinsi":"Ibukota")+': <b>'+cp+'</b></div>';info.style.display="block";
}
window.addEventListener("resize",resize);

var G,N=Math.min(45,POOL.length);
function sh(a){return a.slice().sort(function(){return Math.random()-.5})}
function opts(correct,field){var o=sh(POOL.filter(function(d){return d!==correct})).slice(0,3).map(function(d){return d[field]});o.push(correct[field]);return sh(o)}
function hud(){document.getElementById("rd").textContent=Math.min(G.i+1,N)+"/"+N;document.getElementById("sc").textContent=G.score;document.getElementById("st").textContent=G.streak}
function explore(){
  mode="explore";spin=false;panel.style.display="";HB.style.display="block";document.getElementById("menu").style.display="none";
  panel.innerHTML='<div class="q">Mode Jelajah 🔍</div><div class="sub">Klik wilayah mana pun di globe untuk melihat nama '+(mapId==="idn"?"provinsi dan ibukota provinsinya":"negara dan ibukotanya")+'.</div>';
  say("Klik wilayah mana saja di peta, nanti aku kasih tahu namanya! 🔍");
}
var HB=document.getElementById("homebtn"),hbT=null;
function rstHB(){delete HB.dataset.c;HB.textContent="🏠 Menu Utama";HB.classList.remove("sure")}
HB.onclick=function(){
  if(mode==="game"&&G&&G.i<N&&!HB.dataset.c){HB.dataset.c="1";HB.textContent="Yakin? Klik lagi";HB.classList.add("sure");clearTimeout(hbT);hbT=setTimeout(rstHB,3000);return}
  rstHB();intro();
};
var howOpen=false,BB=document.getElementById("bub"),MS=document.getElementById("mas");
function say(t){BB.innerHTML=t;BB.classList.remove("show");void BB.offsetWidth;BB.classList.add("show")}
function mood(c){MS.classList.remove("jump","oops");void MS.offsetWidth;MS.classList.add(c)}
MS.addEventListener("animationend",function(e){if(e.animationName==="hop"||e.animationName==="wob")MS.classList.remove("jump","oops")});
function pick1(a){return a[Math.floor(Math.random()*a.length)]}
function useMap(m){
  mapId=m;
  if(m==="idn"){feats=IF;F=IFm;POOL=DATA=IP;kt=1.95;N=IP.length;rotateTo([118,-2.5])}
  else{feats=wfeats;F=WF;POOL=WP;DATA=WD;kt=1;N=Math.min(45,WP.length);spin=true}
}
function intro(){
  mode="intro";document.getElementById("info").style.display="none";hl=null;spin=(mapId==="world");
  var idn=mapId==="idn",lab=idn?"provinsi":"negara",mn=document.getElementById("menu");
  panel.innerHTML='<div class="q">Cara bermain 🎮</div><ul><li>'+N+' ronde: tebak <b>nama '+lab+'</b> yang menyala jingga, lalu <b>ibukotanya</b>.</li><li>Benar +10 poin, bonus +5 jika beruntun.</li></ul>';
  panel.style.display=howOpen?"":"none";
  mn.style.display="flex";HB.style.display="none";rstHB();
  document.getElementById("rd").textContent="0/"+N;document.getElementById("sc").textContent="0";document.getElementById("st").textContent="0";
  mn.innerHTML='<button id="mw" class="'+(idn?"":"sel")+'">🌍 Dunia</button><button id="mi" class="'+(idn?"sel":"")+'">🇮🇩 Indonesia</button><button class="go" id="go">▶ Mulai</button><button id="ex">🔍 Jelajahi</button><button class="how" id="hw">'+(howOpen?"✖ Tutup Info":"❓ Cara Bermain")+'</button>';
  document.getElementById("mw").onclick=function(){useMap("world");intro()};
  document.getElementById("mi").onclick=function(){useMap("idn");intro()};
  document.getElementById("ex").onclick=explore;
  document.getElementById("go").onclick=start;
  document.getElementById("hw").onclick=function(){howOpen=!howOpen;panel.style.display=howOpen?"":"none";this.textContent=howOpen?"✖ Tutup Info":"❓ Cara Bermain"};
  say(idn?"Halo! Aku <b>Bumila</b>. Yuk jelajahi provinsi-provinsi Indonesia bersamaku! 🇮🇩":"Halo! Aku <b>Bumila</b>. Yuk keliling dunia dan tebak negaranya bersamaku! 🌍");
}
function start(){mode="game";panel.style.display="";HB.style.display="block";document.getElementById("menu").style.display="none";document.getElementById("info").style.display="none";G={q:sh(POOL).slice(0,N),i:0,score:0,streak:0,wrong:[]};hud();stage("country")}
function stage(st){
  var d=G.q[G.i];hl=F[d.id];hlCol="#ff9f1c";rotateTo(mapId==="idn"?[118,-2.5]:d.cen);hud();
  var isC=st==="country",field=isC?"n":"c",idn=mapId==="idn",L=idn?"Provinsi":"Negara";
  panel.innerHTML='<span class="tag">'+(isC?"Langkah 1: "+L:"Langkah 2: Ibukota")+'</span><div class="q">'+(isC?L+" apakah yang menyala jingga ini?":"Apa ibukota "+(idn?"provinsi ":"")+d.n+"?")+'</div><div class="opts" id="o"></div><div class="msg" id="m"></div>';
  var o=document.getElementById("o");
  say(isC?pick1(["Lihat yang menyala jingga itu. Kamu pasti tahu! 👀","Perhatikan bentuk dan letaknya ya!","Ayo tebak, "+(idn?"provinsi":"negara")+" apa itu?"]):"Hebat! Sekarang tebak ibukotanya ya! 🏛️");
  opts(d,field).forEach(function(t){var b=document.createElement("button");b.textContent=t;b.onclick=function(){answer(b,t===d[field],st,d)};o.appendChild(b)});
}
function answer(btn,ok,st,d){
  var all=document.querySelectorAll("#o button"),field=st==="country"?"n":"c";
  all.forEach(function(b){b.disabled=true;if(b.textContent===d[field])b.classList.add("ok")});
  var m=document.getElementById("m");
  if(ok){G.streak++;var pts=10+(G.streak>1?5:0);G.score+=pts;m.textContent="Benar! +"+pts+" poin 🎉";hlCol="#37d67a";mood("jump");say(pick1(["Hebat sekali! 🎉","Tepat! Kamu jago geografi! 🌟","Benar! Lanjut terus ya! 🚀"])+(G.streak>2?" Beruntun "+G.streak+"x! 🔥":""))}
  else{btn.classList.add("bad");G.streak=0;G.wrong.push(d.n+" → "+d.c);m.textContent="Kurang tepat. Jawabannya: "+d[field];hlCol="#ef476f";mood("oops");say(pick1(["Tidak apa-apa, ayo semangat! 💪","Hampir! Ingat jawabannya ya. 📚","Salah itu bagian dari belajar! 😊"]))}
  hud();
  var tk=G;setTimeout(function(){if(tk!==G||mode!=="game")return;if(st==="country")stage("capital");else{G.i++;if(G.i>=N)end();else stage("country")}},1500);
}
function end(){
  hl=null;hud();document.getElementById("rd").textContent=N+"/"+N;
  var wr=Array.from?Array.from(new Set(G.wrong)):G.wrong,s=G.score,em=s>=Math.round(N*17)?"🏆":s>=Math.round(N*10)?"🌟":"📚";
  panel.innerHTML='<div class="q">'+em+' Selesai! Skor akhir: '+s+'</div>'+(wr.length?'<div style="text-align:left;font-size:.88rem;color:#bcd0f0;margin-bottom:10px"><b>Perlu dipelajari lagi:</b><ul>'+wr.slice(0,5).map(function(w){return"<li>"+w+"</li>"}).join("")+'</ul></div>':'<div class="msg">Sempurna! Tidak ada yang salah.</div>')+'<button class="go" id="again">Main Lagi</button>';
  document.getElementById("again").onclick=start;spin=true;
  mood("jump");say(s>=Math.round(N*17)?"Luar biasa! Kamu penjelajah sejati! 🏆":s>=Math.round(N*10)?"Bagus sekali! Latihan lagi biar makin jago! 🌟":"Semangat! Ayo main lagi, pasti makin hafal! 📚");
}
resize();intro();requestAnimationFrame(loop);
})();
</script>
<script>
(function(){

document.getElementById("av").src=document.getElementById("bp").src;

<script>
(function(){
